name: build-bridge
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build libretrobridge.so (arm64-v8a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK: $NDK"
          CXX="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
          mkdir -p out
          "$CXX" -std=c++17 -O2 -fPIC -shared -static-libstdc++ -Wall -Wno-unused-parameter \
            retrobridge.cpp -o out/libretrobridge.so \
            -landroid -lEGL -lGLESv3 -laaudio -ldl -llog
          ls -l out
      - uses: actions/upload-artifact@v4
        with:
          name: libretrobridge-arm64-v8a
          path: out/libretrobridge.so
